spring.application.name=BillingSystem

# PostgreSQL DB Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/Billing-System
spring.datasource.username=postgres
spring.datasource.password=root

# JPA Properties
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# (Optional) PostgreSQL-specific driver
spring.datasource.driver-class-name=org.postgresql.Driver

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter.json=DEBUG
logging.level.com.example.package=DEBUG

spring.main.allow-circular-references=true
